[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ascendforge"
version = "1.0.0"
description = "DeepSeek Ascend NPU operator infrastructure & training framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["ascendforge*"]
